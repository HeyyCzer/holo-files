name: Release

# Push a tag matching the workspace version (Cargo.toml) to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Run it manually (workflow_dispatch) to only build the artifacts, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags, for the changelog
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
              throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
          }

      - name: Build binaries and installer
        shell: pwsh
        run: .\installer\build.ps1

      - name: Package
        id: package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $dist = New-Item -ItemType Directory -Force dist
          Copy-Item "target\installer\holo-setup-$v.exe" $dist
          $portable = New-Item -ItemType Directory -Force "target\holo-$v"
          Copy-Item target\release\holo.exe, target\release\holo-ui.exe $portable
          Compress-Archive -Path "$portable\*" -DestinationPath "$dist\holo-$v-windows-x64.zip" -Force
          Copy-Item target\release\holo.exe, target\release\holo-ui.exe $dist
          Get-ChildItem $dist | ForEach-Object {
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$dist\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: holo-${{ steps.version.outputs.version }}-windows-x64
          path: dist/*

      - name: Release notes
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # Previous tag reachable from this one; none on the first release -> whole history.
          $prev = git describe --tags --abbrev=0 "$env:GITHUB_REF_NAME^" 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $prev) { "$prev..$env:GITHUB_REF_NAME" } else { $env:GITHUB_REF_NAME }
          $commits = git log $range --no-merges --pretty=format:'- %s (%h)' |
              Where-Object { $_ -notmatch '^- 🔖' }
          if (-not $commits) { $commits = '- No changes.' }
          $body = @"
          ## Changes

          $($commits -join "`n")

          ## Downloads

          | File | What it is |
          |---|---|
          | ``holo-setup-$v.exe`` | **Installer** (recommended). Per-user, no admin: adds ``holo`` to PATH, Start menu entry, optional tray at logon, clean upgrades. |
          | ``holo-$v-windows-x64.zip`` | **Portable**: ``holo.exe`` + ``holo-ui.exe``. Unzip anywhere; keep both in the same folder. |
          | ``holo.exe`` / ``holo-ui.exe`` | Bare executables (CLI / tray + window). ``holo-ui.exe`` needs ``holo.exe`` next to it. |
          | ``SHA256SUMS.txt`` | Checksums. |
          "@
          $body | Set-Content -Encoding utf8 release-notes.md

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          # Appends GitHub's merged-PR list, new contributors and the compare link.
          generate_release_notes: true
