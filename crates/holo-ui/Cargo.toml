[package]
name = "holo-ui"
description = "holo tray icon and status window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "holo-ui"
path = "src/main.rs"

[dependencies]
holo-cli = { path = "../holo-cli" }
holo-core.workspace = true
holo-state.workspace = true
holo-engine.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence"] }
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
