<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="cloud">
      <circle cx="84" cy="122" r="36"/>
      <circle cx="130" cy="98" r="48"/>
      <circle cx="176" cy="128" r="32"/>
      <rect x="64" y="120" width="128" height="40" rx="20"/>
    </clipPath>
    <mask id="file">
      <rect width="256" height="256" fill="#fff"/>
      <path d="M106 80 H134 L150 96 V140 H106 Z" fill="#000"/>
    </mask>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- projector beam + emitter -->
  <path d="M64 160 H192 L148 206 H108 Z" fill="url(#beam)"/>
  <rect x="92" y="204" width="72" height="14" rx="7" fill="#fff"/>
  <!-- holographic cloud with a file cut out of it -->
  <g clip-path="url(#cloud)" mask="url(#file)">
    <rect width="256" height="256" fill="#fff"/>
    <g fill="#6366f1" fill-opacity="0.16">
      <rect y="62" width="256" height="4"/>
      <rect y="78" width="256" height="4"/>
      <rect y="94" width="256" height="4"/>
      <rect y="110" width="256" height="4"/>
      <rect y="126" width="256" height="4"/>
      <rect y="142" width="256" height="4"/>
    </g>
  </g>
  <!-- file details -->
  <path d="M134 80 V96 H150 Z" fill="#fff" fill-opacity="0.85"/>
  <rect x="114" y="110" width="28" height="6" rx="3" fill="#fff" fill-opacity="0.9"/>
  <rect x="114" y="124" width="20" height="6" rx="3" fill="#fff" fill-opacity="0.9"/>
  <!-- status badge -->
  <g transform="translate(136 136) scale(3.5)">
    <circle cx="16" cy="16" r="14.5" fill="#7a808a" stroke="#fff" stroke-width="2.5"/>
    <path d="M12.5 10.5 V21.5 M19.5 10.5 V21.5" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
